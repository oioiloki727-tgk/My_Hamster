:root{--bg:#ffe8b8;--card:#fffaf0;--ink:#4a2a12;--sub:#8a6a4a;--line:#efcf8f;--blue:#2f7de1;--blueD:#1d56a8;--sun:#ffc933;--sunD:#d99a00;--on:#dcecff;--good:#2fa57d;--low:#e5484d}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c4d;--card:#352b6b;--ink:#fff2dc;--sub:#c9bff0;--line:#4d4190;--blue:#4d94f5;--blueD:#2a66bf;--on:#2c3f7a}}
:root[data-theme="dark"]{--bg:#241c4d;--card:#352b6b;--ink:#fff2dc;--sub:#c9bff0;--line:#4d4190;--blue:#4d94f5;--blueD:#2a66bf;--on:#2c3f7a}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(#00000010 2px,transparent 2.5px) 0 0/22px 22px,var(--bg);color:var(--ink);font:16px/1.35 ui-rounded,"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:460px;padding:12px 14px 24px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{display:flex;align-items:center;gap:10px}
header h2{margin-right:auto;font-size:24px;font-weight:900}
.home{flex:none;width:44px;height:44px;border-radius:50%;font-size:22px;font-weight:900;background:var(--card);border:2px solid var(--line);border-bottom-width:5px}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;background:var(--cover) 47% 68%/300% no-repeat;border:3px solid #fff;box-shadow:0 0 0 3px #b9772f}
#name{min-width:0;max-width:46%;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900;font-size:20px;color:#fff;background:linear-gradient(#d9984f,#b9772f);border-radius:14px;padding:5px 16px;box-shadow:0 4px 0 #7a4a21;text-shadow:0 1px 0 #7a4a21}
.coins{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 14px 4px 6px;font-weight:900}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc933 55%,#e0a200);box-shadow:inset 0 0 0 3px #f5b800,0 1px 0 #0003}
.big{--sh:var(--sunD);background:var(--sun);color:#4a2a12;border-radius:20px;padding:16px;font-weight:900;font-size:20px;box-shadow:0 5px 0 var(--sh)}
.big.alt{--sh:var(--blueD);background:var(--blue);color:#fff}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.link{text-decoration:underline;color:var(--sub);padding:6px;font-weight:700}
#menu{min-height:80dvh;justify-content:center;text-align:center;gap:16px}
#menu p{color:var(--sub);font-weight:700}
.cover{width:100%;max-width:400px;margin:0 auto;aspect-ratio:1169/1154;border-radius:28px;background:var(--cover) center/cover;box-shadow:0 0 0 4px #fff,0 8px 0 4px var(--line),0 16px 30px #0003}
#room{position:relative;height:290px;border-radius:26px;overflow:hidden;display:grid;place-items:end center;background:repeating-linear-gradient(90deg,#d9a05c 0 56px,#c98b45 56px 59px);box-shadow:0 0 0 4px #8a5a2b,0 7px 0 4px #6b4220;transition:filter .6s}
#room::before{content:"";position:absolute;inset:auto 0 0 0;height:32%;z-index:1;background:radial-gradient(#d3a35e 1.6px,transparent 2px) 0 0/15px 15px,#ecc98c;border-top:4px solid #b9772f}
#room.night{filter:brightness(.5) saturate(.8)}
.bottle{position:absolute;left:14px;top:40px;width:34px;height:84px;border-radius:10px 10px 14px 14px;background:linear-gradient(90deg,#ffffff99,#cfe6ff66);border:3px solid #fff9;border-top:12px solid #2f7de1}
.bottle::after{content:"";position:absolute;left:9px;bottom:-26px;width:8px;height:24px;background:#9aa7b5;border-radius:4px}
.wheel{position:absolute;right:-30px;bottom:70px;width:130px;height:130px;border-radius:50%;border:9px solid #2f7de1;background:repeating-conic-gradient(#2f7de133 0 6deg,transparent 6deg 30deg)}
#hamster{position:relative;z-index:2;width:230px;margin-bottom:6px;cursor:pointer;user-select:none;animation:breathe 3.2s ease-in-out infinite}
#hamster svg{display:block;width:100%;height:auto;overflow:visible}
#hamster.bounce{animation:hop .35s}
.eat .ck{transform-box:fill-box;transform-origin:center;animation:chew .28s 4}
.z{font:800 22px ui-rounded,sans-serif;animation:zz 2s ease-in-out infinite}
#status{position:absolute;z-index:3;top:12px;left:50%;transform:translateX(-50%);background:#fffffff0;color:#4a2a12;border-radius:99px;padding:4px 16px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 #0002}
#snack{position:absolute;z-index:3;left:50%;top:48px;font-size:40px;opacity:0}
#snack.drop{animation:drop .9s ease-in}
#msg{position:fixed;z-index:20;pointer-events:none;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 18px;font-size:15px;font-weight:800;opacity:0;transition:opacity .2s;max-width:92vw;text-align:center;box-shadow:0 4px 14px #0004}
#msg.show{opacity:1}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:12px 14px}
.bar label{font-size:13px;font-weight:800}
.bar i{display:block;height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.bar b{display:block;height:100%;border-radius:9px;transition:width .5s,background .5s;box-shadow:inset 0 3px 0 #fff4}
.bar:nth-child(1) b{background:#ff9a2e}.bar:nth-child(2) b{background:#ff6fa5}.bar:nth-child(3) b{background:#f2c200}.bar:nth-child(4) b{background:#3aa0ff}
#stats .bar b.low{background:var(--low);animation:pulse 1s infinite}
.hint{background:var(--card);border:2px solid var(--line);border-left:7px solid var(--sun);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700}
#tabs{display:flex;gap:6px;background:var(--line);padding:5px;border-radius:18px}
#tabs button{flex:1;padding:10px;border-radius:14px;font-weight:900;color:var(--sub)}
#tabs .on{background:var(--card);color:var(--ink);box-shadow:0 3px 0 #0002}
#panel{display:grid;gap:10px}
.tip{font-size:14px;font-weight:600;color:var(--sub)}
#panel>button,.toy{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:12px;text-align:left}
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--on);display:grid;place-items:center;font-size:26px}
.tx{flex:1;display:grid}
.tx b{font-weight:900}
.tx small{font-weight:600;color:var(--sub);font-size:13px}
.price{flex:none;font-weight:900;font-size:14px;background:var(--sun);color:#4a2a12;border-radius:99px;padding:3px 12px;white-space:nowrap}
.price.free{background:var(--good);color:#fff}
#panel h3,#shop-body h3{font-size:16px;font-weight:900;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800}
.grid svg{width:84px;height:84px;background:var(--on);border-radius:16px}
.grid .on{border-color:var(--blue)}
.grid .lock{opacity:.6}
.tag{font-size:13px;font-weight:800;border-radius:99px;padding:2px 12px;background:var(--on)}
.tag.cost{background:var(--sun);color:#4a2a12}
.tag.worn{background:var(--good);color:#fff}
footer{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);font-weight:700}
footer button{text-decoration:underline}
#dlg,#tut{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}
#dlg>div,#tut>div{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px;width:100%;max-width:340px;display:grid;gap:12px}
#dlg h2,#tut h2{font-size:20px;font-weight:900}
#tut small{color:var(--sub);font-weight:700}
#tut .row{display:flex;justify-content:space-between;align-items:center}
#tut .big,#dlg .big{padding:12px 22px;font-size:17px}
#dlg input{font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.xp{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.xp i{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.xp i b{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a5cff,#c07bff);border-radius:9px;transition:width .5s;box-shadow:inset 0 3px 0 #fff4}
.xp small{color:var(--sub);min-width:46px;text-align:right}
em{font-style:normal;background:var(--sun);color:#4a2a12;border-radius:99px;padding:0 7px;font-size:12px;margin-left:6px}
.legend svg{filter:drop-shadow(0 0 14px #ffd54a)}
#panel>button.gold{box-shadow:0 0 0 3px var(--sun)}
#panel>button.lock{opacity:.6}
#toys{position:absolute;z-index:3;left:10px;bottom:8px;display:grid;grid-template-columns:repeat(2,28px);gap:2px;font-size:22px;line-height:1}
.list{display:grid;gap:10px}
.toy.on{border-color:var(--good)}
.toy.lock{opacity:.6}
@keyframes breathe{50%{transform:scale(1.03)}}
@keyframes hop{40%{transform:translateY(-26px) scale(1.04)}}
@keyframes chew{50%{transform:scale(1.3)}}
@keyframes zz{50%{transform:translateY(-8px);opacity:.4}}
@keyframes pulse{50%{opacity:.55}}
@keyframes drop{from{opacity:1;transform:translate(-50%,-6px)}to{opacity:0;transform:translate(-50%,130px) scale(.5)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#auth{min-height:80dvh;justify-content:center;text-align:center;gap:14px}
#auth .cover{max-width:200px}
#auth h2{font-size:26px;font-weight:900}
.seg{display:flex;gap:6px;background:var(--line);padding:5px;border-radius:18px}
.seg button{flex:1;padding:10px;border-radius:14px;font-weight:900;color:var(--sub)}
.seg .on{background:var(--card);color:var(--ink);box-shadow:0 3px 0 #0002}
#a-form{display:grid;gap:10px;text-align:left}
#a-form input{width:100%;font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
#a-form input:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
#a-form .big:disabled{opacity:.6}
.a-msg{font-weight:700;color:var(--low);text-align:center}
.a-msg.ok{color:var(--good)}
.who{color:var(--sub);font-weight:700;font-size:14px;word-break:break-all}
</style>
</head>
<body>
<main id="auth" hidden>
  <div class="cover" role="img" aria-label="ТГК: Мой хомячок"></div>
  <h2>Мой хомячок</h2>
  <div class="seg"><button type="button" id="a-login" class="on">Вход</button><button type="button" id="a-reg">Регистрация</button></div>
  <form id="a-form" novalidate>
    <input id="a-email" type="email" inputmode="email" autocomplete="email" placeholder="Почта" maxlength="254" required>
    <input id="a-pass" type="password" autocomplete="current-password" placeholder="Пароль" maxlength="128" required>
    <p class="tip" id="a-hint" hidden>Пароль: от 8 символов. На почту придёт письмо со ссылкой подтверждения.</p>
    <button class="big" id="a-go" type="submit">Войти</button>
  </form>
  <p class="a-msg" id="a-msg" role="status" hidden></p>
  <button class="link" id="a-resend" type="button" hidden>Отправить письмо ещё раз</button>
  <button class="link" id="a-guest" type="button">Играть без входа</button>
</main>
<main id="menu" hidden>
  <div class="cover" role="img" aria-label="ТГК: Мой хомячок"></div>
  <h1 class="sr">Мой хомячок</h1>
  <p>Заботьтесь о хомяке, получайте монеты и покупайте ему скины.</p>
  
  <button class="big" data-go="game">Играть</button>
  <button class="big alt" data-go="shop">Магазин</button>
  <button class="link" id="how">Как играть</button>
  <p class="who" id="who"></p>
  <button class="link" id="logout" hidden>Выйти</button>
  <button class="link" id="login" hidden>Войти или зарегистрироваться</button>
</main>
<main id="shop" hidden>
  <header><button class="home" data-go="menu" title="В меню">←</button><h2>Магазин</h2><div class="coins"><i class="coin"></i><span id="coins2">0</span></div></header>
  <p class="tip">Монеты даются за заботу о хомяке. Нажмите на товар, чтобы купить и надеть. Купленное можно менять бесплатно.</p>
  <div id="shop-body"></div>
  <button class="big" data-go="game">Играть</button>
</main>
<main id="game" hidden>
  <header>
    <button class="home" data-go="menu" title="В меню">←</button>
    <i class="avatar"></i>
    <button id="name" title="Переименовать"></button>
    <div class="coins"><i class="coin"></i><span id="coins">0</span></div>
  </header>
  <section id="room">
    <i class="bottle"></i><i class="wheel"></i><div id="toys"></div><div id="status"></div><div id="snack"></div>
    <div id="hamster"></div>
    
  </section>
  <section id="stats">
    <div class="bar"><label>🍽️ Сытость</label><i><b id="b-hunger"></b></i></div>
    <div class="bar"><label>💛 Радость</label><i><b id="b-joy"></b></i></div>
    <div class="bar"><label>⚡ Силы</label><i><b id="b-energy"></b></i></div>
    <div class="bar"><label>🫧 Чистота</label><i><b id="b-clean"></b></i></div>
  </section>
  <div class="xp"><b id="lvl"></b><i><b id="b-xp"></b></i><small id="xpn"></small></div>
  <div class="hint" id="hint"></div>
  <nav id="tabs">
    <button data-tab="care" class="on">💗 Уход</button>
    <button data-tab="food">🍽️ Еда</button>
    <button data-tab="grow">⭐ Рост</button>
    
  </nav>
  <section id="panel"></section>
  <footer><span id="age"></span> <button id="reset">Начать заново</button></footer>
</main>
<div id="msg"></div>
<div id="tut" hidden><div><small id="tut-n"></small><h2 id="tut-t"></h2><p id="tut-d"></p><div class="row"><button class="link" id="tut-skip">Пропустить</button><button class="big" id="tut-next">Далее</button></div></div></div>
<div id="dlg" hidden><div><h2 id="dlg-t"></h2><input id="dlg-in" maxlength="16" autocomplete="off"><button class="big" id="dlg-ok">Готово</button></div></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const FOODS = [
  {id:'seed',n:'Семечки',i:'🌻',p:0,h:18,j:2,e:6},
  {id:'carrot',n:'Морковка',i:'🥕',p:4,h:30,j:5,e:10},
  {id:'corn',n:'Кукуруза',i:'🌽',p:6,h:40,j:7,e:15},
  {id:'cheese',n:'Сыр',i:'🧀',p:10,h:35,j:16,e:12}
];
const COLORS = [
  {id:'c0',t:'color',n:'Классика',p:0,fur:'#e9a24b',lite:'#fbe3b8'},
  {id:'c1',t:'color',n:'Лунный',p:30,fur:'#8fa6d8',lite:'#e6ecfb'},
  {id:'c2',t:'color',n:'Розовый',p:30,fur:'#f08fb0',lite:'#ffe1ea'},
  {id:'c3',t:'color',n:'Мятный',p:40,fur:'#6fcfa8',lite:'#def7ec'},
  {id:'c4',t:'color',n:'Тень',p:60,fur:'#5a5470',lite:'#bdb7d4'}
];
const HATS = [
  {id:'h0',t:'hat',n:'Без аксессуара',p:0,g:''},
  {id:'h1',t:'hat',n:'Бант',p:15,g:'<path d="M140 42l-22-14v28zM140 42l22-14v28z" fill="#ff5d8f"/><circle cx="140" cy="42" r="6" fill="#d63a6b"/>'},
  {id:'h6',t:'hat',n:'Очки',p:20,g:'<g fill="#ffffff55" stroke="#222" stroke-width="3.5"><circle cx="78" cy="88" r="15"/><circle cx="122" cy="88" r="15"/></g><path d="M93 88h14" stroke="#222" stroke-width="3.5"/>'},
  {id:'h2',t:'hat',n:'Кепка',p:25,g:'<path d="M54 64Q100 6 146 64z" fill="#3b82f6"/><path d="M110 60h56q6 0 6 6h-62z" fill="#2563eb"/><circle cx="100" cy="30" r="4" fill="#2563eb"/>'},
  {id:'h3',t:'hat',n:'Цилиндр',p:40,g:'<rect x="62" y="54" width="76" height="11" rx="5" fill="#222"/><rect x="74" y="12" width="52" height="46" rx="4" fill="#222"/><rect x="74" y="42" width="52" height="8" fill="#e5484d"/>'},
  {id:'h4',t:'hat',n:'Колпак',p:50,g:'<path d="M58 64Q88 6 150 22Q126 30 140 64z" fill="#e5484d"/><rect x="54" y="58" width="92" height="12" rx="6" fill="#fff"/><circle cx="150" cy="22" r="8" fill="#fff"/>'},
  {id:'h5',t:'hat',n:'Корона',p:100,g:'<path d="M68 62L72 24L88 44L100 18L112 44L128 24L132 62z" fill="#f4b400"/><rect x="66" y="58" width="68" height="9" rx="3" fill="#d89b00"/><circle cx="100" cy="40" r="4" fill="#e5484d"/>'}
];
const ALL = [...COLORS, ...HATS];
const BASE_KEY = 'hamster-save-v1';
let KEY = BASE_KEY, USER = null, SERVER = false, lastPush = 0;
const clamp = v => Math.max(0, Math.min(100, v));
const fresh = () => ({name:'',coins:10,hunger:80,joy:80,energy:80,clean:80,own:['c0','h0'],color:'c0',hat:'h0',sleep:false,sleepFrom:0,tut:false,lvl:1,xp:0,rebirths:0,up:{},toys:[],born:Date.now(),last:Date.now()});

function hamster(color, hat, mood) {
  const c = COLORS.find(x => x.id === color) || COLORS[0], h = HATS.find(x => x.id === hat) || HATS[0];
  const ink = '#2b2250', st = (col, w) => `fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"`;
  const eyes = mood === 'sleep'
    ? `<path d="M68 90q10 8 20 0M112 90q10 8 20 0" ${st(ink, 3.5)}/>`
    : `<circle cx="78" cy="88" r="7.5" fill="${ink}"/><circle cx="122" cy="88" r="7.5" fill="${ink}"/><circle cx="80.5" cy="85.5" r="2.5" fill="#fff"/><circle cx="124.5" cy="85.5" r="2.5" fill="#fff"/>`
      + (mood === 'sad' ? `<path d="M66 80l22-8M134 80l-22-8" ${st(ink, 3)}/>` : '');
  const mouth = mood === 'eat' ? '<ellipse cx="100" cy="119" rx="7" ry="6" fill="#7a2f3b"/>'
    : mood === 'sad' ? `<path d="M100 109v3M89 123q11-9 22 0" ${st('#7a4a3a', 3)}/>`
    : `<path d="M100 109v4M100 113q-7 7-13 2M100 113q7 7 13 2" ${st('#7a4a3a', 3)}/>`;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Хомяк">
<circle cx="58" cy="54" r="19" fill="${c.fur}"/><circle cx="142" cy="54" r="19" fill="${c.fur}"/>
<circle cx="58" cy="56" r="10" fill="#f7b6bd"/><circle cx="142" cy="56" r="10" fill="#f7b6bd"/>
<ellipse cx="100" cy="140" rx="58" ry="50" fill="${c.fur}"/><ellipse cx="100" cy="152" rx="36" ry="32" fill="${c.lite}"/>
<ellipse cx="70" cy="186" rx="17" ry="9" fill="${c.lite}"/><ellipse cx="130" cy="186" rx="17" ry="9" fill="${c.lite}"/>
<ellipse cx="80" cy="150" rx="10" ry="8" fill="${c.lite}" stroke="${c.fur}" stroke-width="2"/><ellipse cx="120" cy="150" rx="10" ry="8" fill="${c.lite}" stroke="${c.fur}" stroke-width="2"/>
<ellipse cx="100" cy="92" rx="62" ry="54" fill="${c.fur}"/><ellipse cx="100" cy="108" rx="40" ry="30" fill="${c.lite}"/>
<circle class="ck" cx="62" cy="112" r="13" fill="#f59aa8" opacity=".55"/><circle class="ck" cx="138" cy="112" r="13" fill="#f59aa8" opacity=".55"/>
${eyes}<ellipse cx="100" cy="104" rx="6" ry="4.5" fill="#e58b9a"/>${mouth}
<path d="M58 106l-26-6M58 114l-26 4M142 106l26-6M142 114l26 4" ${st('#2b225066', 2)}/>
${h.g}${mood === 'sleep' ? '<text class="z" x="150" y="40" fill="#2b2250">z</text><text class="z" x="170" y="22" fill="#2b2250" style="animation-delay:.6s">z</text>' : ''}</svg>`;
}

let S = fresh();
const readLocal = k => { try { const j = JSON.parse(localStorage.getItem(k)); return j && typeof j === 'object' ? Object.assign(fresh(), j) : null; } catch (e) { return null; } };
let tab = 'care', msgTimer, fx = '', fxTimer, lastKey = '';

const save = () => { S.last = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} push(); };

async function api(method, path, body) {
  const r = await fetch(path, {
    method, credentials: 'same-origin',
    headers: method === 'GET' ? {} : { 'Content-Type': 'application/json' },
    body: method === 'GET' ? undefined : JSON.stringify(body || {}),
    keepalive: method === 'PUT'
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(j.error || 'Ошибка'); e.status = r.status; e.code = j.code; throw e; }
  return j;
}
function push(force) {
  if (!USER) return Promise.resolve();
  const n = Date.now();
  if (!force && n - lastPush < 15000) return Promise.resolve();
  lastPush = n;
  return api('PUT', '/api/save', S).catch(() => {});
}
addEventListener('pagehide', () => push(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') push(true); });
const earn = n => { S.coins += n; return ` +${n} 🪙`; };
const MAXLVL = 10, MAXUP = 5;
const STAGES = ['Малыш', 'Малыш', 'Подросток', 'Подросток', 'Хомяк', 'Хомяк', 'Силач', 'Силач', 'Мастер', 'Легенда'];
const UPS = [
  {id:'play',n:'Игрушки',i:'🧸',d:'Больше монет и радости от игры',base:15},
  {id:'wash',n:'Ванна',i:'🛁',d:'Больше монет за мытьё',base:15},
  {id:'sleep',n:'Кроватка',i:'🛏️',d:'Сон быстрее, монет больше',base:20},
  {id:'feed',n:'Кормушка',i:'🥣',d:'Еда сытнее и бодрит сильнее, монет больше',base:15},
  {id:'home',n:'Уютный домик',i:'🏠',d:'Шкалы падают медленнее',base:30}
];
const lv = id => (S.up && S.up[id]) || 0;
const dk = () => (1 - .1 * lv('home')) * (has('cube') ? .9 : 1);
const need = () => 40 + S.lvl * 20;
const rew = (id, b) => Math.round(b * (1 + .5 * lv(id)) * (1 + .25 * S.rebirths) * (has('bell') ? 1.2 : 1));
const upCost = (u, l) => Math.round(u.base * Math.pow(1.7, l));
const badge = id => lv(id) ? `<em>+${lv(id)}</em>` : '';
let rb = 0;
const TOYS = [
  {id:'ball',n:'Мячик',i:'🎾',p:25,d:'Игра тратит 10 сил вместо 15'},
  {id:'yarn',n:'Клубок',i:'🧶',p:40,d:'+25% опыта за заботу'},
  {id:'bell',n:'Колокольчик',i:'🔔',p:60,d:'+20% монет за заботу'},
  {id:'cube',n:'Кубик',i:'🎲',p:80,d:'Шкалы падают на 10% медленнее'},
  {id:'log',n:'Бревно',i:'🪵',p:100,d:'Сон восстанавливает силы на 25% быстрее'}
];
const has = id => !!(S.toys && S.toys.includes(id));
const playCost = () => has('ball') ? 10 : 15;
const toyRow = t => {
  const own = has(t.id);
  return `<button class="toy ${own ? 'on' : S.coins < t.p ? 'lock' : ''}" data-t="${t.id}"><span class="ic">${t.i}</span><span class="tx"><b>${t.n}</b><small>${t.d}</small></span><span class="price ${own ? 'free' : ''}">${own ? 'куплено' : '🪙 ' + t.p}</span></button>`;
};

function gainXp(n) {
  if (S.lvl >= MAXLVL) return '';
  S.xp += Math.round(n * (has('yarn') ? 1.25 : 1)); let msg = '';
  while (S.lvl < MAXLVL && S.xp >= need()) {
    S.xp -= need(); S.lvl++;
    const b = 5 * S.lvl; S.coins += b; msg = ` Уровень ${S.lvl}! +${b} 🪙`;
  }
  if (S.lvl >= MAXLVL) S.xp = 0;
  return msg;
}

function growHtml() {
  const max = S.lvl >= MAXLVL, x = n => (1 + .25 * n).toFixed(2);
  let h = `<p class="tip">За заботу хомяк получает опыт и растёт. Улучшайте кнопки ухода за монеты. На ${MAXLVL} уровне можно переродиться.</p>`;
  h += UPS.map(u => {
    const l = lv(u.id), c = upCost(u, l), full = l >= MAXUP;
    return `<button data-u="${u.id}" class="${!full && S.coins < c ? 'lock' : ''}"><span class="ic">${u.i}</span><span class="tx"><b>${u.n}${badge(u.id)}</b><small>${u.d}</small><small>Уровень ${l} из ${MAXUP}</small></span><span class="price ${full ? 'free' : ''}">${full ? 'макс.' : '🪙 ' + c}</span></button>`;
  }).join('');
  h += `<button data-a="rebirth" class="${max ? 'gold' : 'lock'}"><span class="ic">🔄</span><span class="tx"><b>Перерождение</b><small>${max ? 'Начать заново: монеты навсегда ×' + x(S.rebirths + 1) : 'Откроется на ' + MAXLVL + ' уровне'}</small><small>Сейчас ×${x(S.rebirths)}, перерождений: ${S.rebirths}</small></span></button>`;
  return h;
}

function say(t) {
  const m = $('#msg'); m.textContent = t; m.classList.add('show');
  clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove('show'), 2400);
}
function snack(e) { const s = $('#snack'); s.textContent = e; s.classList.remove('drop'); void s.offsetWidth; s.classList.add('drop'); }
function bounce() { const h = $('#hamster'); h.classList.remove('bounce'); void h.offsetWidth; h.classList.add('bounce'); }
function eating() { fx = 'eat'; clearTimeout(fxTimer); fxTimer = setTimeout(() => { fx = ''; stats(); }, 1200); }

function wake() {
  const gain = S.energy - S.sleepFrom;
  S.sleep = false;
  say(gain >= 40 ? 'Выспался!' + gainXp(15) : 'Проснулся');
}

function tick(sec) {
  const m = sec / 60;
  if (S.sleep) {
    const r = 30 * (1 + .25 * lv('sleep')) * (has('log') ? 1.25 : 1), act = Math.min(sec, (100 - S.energy) / r * 60);
    S.sleepT = (S.sleepT || 0) + act;
    const n = Math.floor(S.sleepT / 10);
    if (n > 0) { S.sleepT -= n * 10; S.coins += n * rew('sleep', 2); }
    S.energy = clamp(S.energy + r * m);
    S.hunger = clamp(S.hunger - .3 * m);
    if (S.energy >= 100) wake();
  } else {
    S.hunger = clamp(S.hunger - 1.2 * dk() * m);
    S.joy = clamp(S.joy - .8 * dk() * m);
    S.clean = clamp(S.clean - .6 * dk() * m);
    S.energy = clamp(S.energy - .5 * dk() * m);
  }
  if (S.hunger < 10) S.joy = clamp(S.joy - .5 * m);
}

const curMood = () => S.sleep ? 'sleep' : fx === 'eat' ? 'eat' : (S.hunger < 25 || S.joy < 25 || S.clean < 25) ? 'sad' : 'ok';
const statusText = () => S.sleep ? 'Спит…' : S.hunger < 25 ? 'Хочет есть!' : S.clean < 25 ? 'Нужна ванна' : S.energy < 20 ? 'Очень устал' : S.joy < 25 ? 'Скучает' : S.joy > 70 && S.hunger > 50 ? 'Счастлив!' : 'Всё хорошо';

function stats() {
  $('#coins').textContent = $('#coins2').textContent = Math.floor(S.coins);
  $('#hint').textContent = '💡 ' + hint();
  const top = S.lvl >= MAXLVL;
  $('#lvl').textContent = `Ур. ${S.lvl} · ${STAGES[S.lvl - 1]}`;
  $('#b-xp').style.width = (top ? 100 : S.xp / need() * 100) + '%';
  $('#xpn').textContent = top ? 'макс.' : S.xp + '/' + need();
  $('#hamster').style.width = (140 + S.lvl * 8) + 'px';
  $('#hamster').classList.toggle('legend', top);
  $('#toys').innerHTML = TOYS.filter(t => has(t.id)).map(t => `<span title="${t.n}">${t.i}</span>`).join('');
  for (const k of ['hunger', 'joy', 'energy', 'clean']) {
    const b = $('#b-' + k); b.style.width = S[k] + '%'; b.classList.toggle('low', S[k] < 25);
  }
  const m = curMood(), key = S.color + S.hat + m;
  if (key !== lastKey) { lastKey = key; $('#hamster').innerHTML = hamster(S.color, S.hat, m); }
  $('#hamster').classList.toggle('eat', m === 'eat');
  $('#status').textContent = statusText();
  $('#room').classList.toggle('night', S.sleep);
  $('#age').textContent = 'День ' + (Math.floor((Date.now() - S.born) / 864e5) + 1);
}

const item = x => {
  const own = S.own.includes(x.id), on = S.color === x.id || S.hat === x.id;
  const pic = hamster(x.t === 'color' ? x.id : S.color, x.t === 'hat' ? x.id : S.hat, 'ok');
  return `<button class="${on ? 'on' : own || S.coins >= x.p ? '' : 'lock'}" data-s="${x.id}">${pic}${x.n}<small class="tag ${on ? 'worn' : own ? '' : 'cost'}">${on ? 'надето' : own ? 'надеть' : '🪙 ' + x.p}</small></button>`;
};

function panel() {
  $('#name').textContent = S.name + (S.rebirths ? ' ⭐' + S.rebirths : '');
  let h = '';
  if (tab === 'care') h =
    `<p class="tip">Монеты даются за заботу, когда хомяк в ней нуждается: покормили голодного, помыли грязного, развлекли скучающего. За игру монеты идут всегда, но она тратит силы: восстановите их едой или сном.</p>
     <button data-a="play"><span class="ic">🧸</span><span class="tx"><b>Поиграть${badge('play')}</b><small>🪙 ${rew('play', 3)}–${rew('play', 6)} за игру, −${playCost()} сил</small></span></button>
     <button data-a="wash"><span class="ic">🛁</span><span class="tx"><b>Помыть${badge('wash')}</b><small>🪙 ${rew('wash', 5)}, если грязный</small></span></button>
     <button data-a="sleep"><span class="ic">${S.sleep ? '☀️' : '😴'}</span><span class="tx"><b>${S.sleep ? 'Разбудить' : 'Уложить спать'}${badge('sleep')}</b><small>+${Math.round(15 * (1 + .25 * lv('sleep')) * (has('log') ? 1.25 : 1))} сил за 30 сек, 🪙 ${rew('sleep', 2)} за 10 сек</small></span></button>`;
  if (tab === 'food') h = '<p class="tip">Семечки бесплатные. Остальная еда за монеты: сытнее, радует больше и лучше восстанавливает силы.</p>'
    + FOODS.map(f => `<button data-f="${f.id}"><span class="ic">${f.i}</span><span class="tx"><b>${f.n}${badge('feed')}</b><small>сытость +${f.h}, силы +${f.e}, радость +${f.j}</small></span><span class="price ${f.p ? '' : 'free'}">${f.p ? '🪙 ' + f.p : 'бесплатно'}</span></button>`).join('');
  
  if (tab === 'grow') h = growHtml();
  $('#panel').innerHTML = h;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}

const redraw = () => { stats(); panel(); save(); };

$('#panel').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.a === 'play') {
    if (S.sleep) return say('Он спит 😴');
    if (S.energy < playCost()) return say('Слишком устал: покормите его или уложите спать');
    const need = S.joy < 60;
    S.energy = clamp(S.energy - playCost()); S.hunger = clamp(S.hunger - 6); S.joy = clamp(S.joy + 25 + 4 * lv('play'));
    bounce(); say('Поиграли!' + earn(rew('play', need ? 6 : 3)) + gainXp(need ? 12 : 5));
  } else if (d.a === 'wash') {
    if (S.sleep) return say('Он спит 😴');
    const need = S.clean < 60;
    S.clean = 100; say('Чистенький!' + (need ? earn(rew('wash', 5)) + gainXp(10) : ''));
  } else if (d.a === 'sleep') {
    if (S.sleep) wake(); else { S.sleep = true; S.sleepFrom = S.energy; S.sleepT = 0; say('Спокойной ночи'); }
  } else if (d.a === 'rebirth') {
    if (S.lvl < MAXLVL) return say('Нужен ' + MAXLVL + ' уровень');
    if (Date.now() - rb > 4000) { rb = Date.now(); return say('Нажмите ещё раз: прогресс сбросится, бонус монет останется'); }
    S.rebirths++; S.lvl = 1; S.xp = 0; S.up = {}; S.coins = 10; S.sleep = false;
    S.hunger = S.joy = S.energy = S.clean = 100; tab = 'care';
    say('Перерождение! Монеты теперь ×' + (1 + .25 * S.rebirths).toFixed(2));
  } else if (d.t) {
    const t = TOYS.find(x => x.id === d.t);
    if (has(t.id)) return say(t.n + ' уже у хомяка');
    if (S.coins < t.p) return say('Не хватает монет');
    S.coins -= t.p; S.toys.push(t.id); say(t.n + ': ' + t.d);
  } else if (d.u) {
    const u = UPS.find(x => x.id === d.u), l = lv(u.id), c = upCost(u, l);
    if (l >= MAXUP) return say('Уже максимум');
    if (S.coins < c) return say('Не хватает монет');
    S.coins -= c; S.up[u.id] = l + 1; say(u.n + ': уровень ' + (l + 1));
  } else if (d.f) {
    const f = FOODS.find(x => x.id === d.f);
    if (S.sleep) return say('Он спит 😴');
    if (S.hunger > 90) return say('Не хочет, он сыт. Силы вернёт сон');
    if (S.coins < f.p) return say('Не хватает монет');
    const need = S.hunger < 70;
    S.coins -= f.p; S.hunger = clamp(S.hunger + f.h * (1 + .1 * lv('feed'))); S.joy = clamp(S.joy + f.j); S.energy = clamp(S.energy + f.e * (1 + .1 * lv('feed')));
    snack(f.i); eating(); say('Ням!' + (need ? earn(rew('feed', 4)) + gainXp(10) : ''));
  } else if (d.s) {
    const x = ALL.find(v => v.id === d.s);
    if (!S.own.includes(x.id)) {
      if (S.coins < x.p) return say('Не хватает монет');
      S.coins -= x.p; S.own.push(x.id);
    }
    S[x.t] = x.id; say('Надето: ' + x.n);
  }
  redraw();
};

$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; panel(); } };

$('#hamster').onclick = () => {
  if (S.sleep) return say('Тсс, он спит');
  bounce(); S.joy = clamp(S.joy + 2);
  say(['Пи!', 'Пи-пи!', 'Хрум?'][Math.floor(Math.random() * 3)]);
  stats();
};

function ask(title, def, cb) {
  const d = $('#dlg'), i = $('#dlg-in');
  $('#dlg-t').textContent = title; i.value = def; d.hidden = false; i.focus(); i.select();
  const done = () => { d.hidden = true; cb(i.value.trim().slice(0, 16) || def); };
  $('#dlg-ok').onclick = done;
  i.onkeydown = e => { if (e.key === 'Enter') done(); };
}
const askName = def => ask('Как зовут хомяка?', def || 'Хомка', n => { S.name = n; redraw(); if (!S.tut) tutorial(); });
$('#name').onclick = () => askName(S.name);

let armed = 0;
$('#reset').onclick = e => {
  const b = e.target;
  if (!armed) {
    b.textContent = 'Удалить прогресс? Нажмите ещё раз';
    armed = setTimeout(() => { armed = 0; b.textContent = 'Начать заново'; }, 3000);
    return;
  }
  clearTimeout(armed); armed = 0; b.textContent = 'Начать заново';
  S = fresh(); lastKey = ''; redraw(); askName();
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const gap = (Date.now() - S.last) / 1000 - 1;
  if (gap > 2) { tick(Math.min(gap, 10800)); redraw(); }
});

const STEPS = [
  {t:'Знакомьтесь!', d:'Это ваш хомяк. Нажмите на него, чтобы погладить.'},
  {t:'Шкалы', d:'Сытость, радость, силы и чистота со временем падают. Следите, чтобы они не стали красными.'},
  {t:'Уход и еда', d:'Во вкладке «Уход» хомяка можно помыть, поиграть с ним и уложить спать. Во вкладке «Еда» его можно покормить: еда восстанавливает силы. Семечки бесплатные.'},
  {t:'Монеты', d:'Монеты даются за заботу, когда хомяк в ней нуждается: покормили голодного, помыли грязного, развлекли скучающего. Если у него всё хорошо, за кормление и мытьё награды не будет, а за игру монеты идут всегда.'},
  {t:'Рост', d:'За заботу хомяк получает опыт и растёт. Во вкладке «Рост» улучшайте кнопки ухода. На 10 уровне можно переродиться: всё начнётся заново, но монет станет больше навсегда.'},
  {t:'Магазин', d:'На монеты в магазине покупаются игрушки с бонусами, цвета шерсти и аксессуары. Он открывается из меню: нажмите ← в левом верхнем углу.'}
];
let ti = 0;
function tutorial() { ti = 0; $('#tut').hidden = false; tutStep(); }
function tutStep() {
  const s = STEPS[ti];
  $('#tut-n').textContent = 'Шаг ' + (ti + 1) + ' из ' + STEPS.length;
  $('#tut-t').textContent = s.t; $('#tut-d').textContent = s.d;
  $('#tut-next').textContent = ti === STEPS.length - 1 ? 'Понятно' : 'Далее';
}
function endTut() { $('#tut').hidden = true; S.tut = true; save(); }
$('#tut-next').onclick = () => { if (++ti >= STEPS.length) endTut(); else tutStep(); };
$('#tut-skip').onclick = endTut;
$('#how').onclick = tutorial;

function hint() {
  if (S.sleep) return 'Пусть поспит: каждые 10 секунд сна дают монеты.';
  if (S.hunger < 40) return 'Хомяк голоден. Откройте «Еда» и покормите его, за это дадут монеты.';
  if (S.clean < 40) return 'Хомяк грязный. Помойте его во вкладке «Уход».';
  if (S.joy < 40) return 'Хомяку скучно. Поиграйте с ним во вкладке «Уход».';
  if (S.energy < 30) return 'Хомяк устал. Покормите его (еда даёт силы) или уложите спать.';
  if (S.lvl >= MAXLVL) return 'Максимальный уровень! Откройте «Рост» и переродитесь.';
  if (UPS.some(u => lv(u.id) < MAXUP && S.coins >= upCost(u, lv(u.id)))) return 'Монет хватает на улучшение. Загляните во вкладку «Рост».';
  const left = ALL.filter(x => !S.own.includes(x.id)).map(x => x.p).concat(TOYS.filter(t => !has(t.id)).map(t => t.p));
  if (left.length && S.coins >= Math.min(...left)) return 'Монет хватает на новую покупку: скин или игрушку. Нажмите ← и откройте «Магазин».';
  return 'Всё хорошо. Когда шкала просядет, позаботьтесь о хомяке и получите монеты.';
}

function renderShop() {
  $('#shop-body').innerHTML = '<h3>Игрушки с бонусами</h3><div class="list">' + TOYS.map(toyRow).join('') + '</div><h3>Цвет шерсти</h3><div class="grid">' + COLORS.map(item).join('') + '</div><h3>Аксессуары</h3><div class="grid">' + HATS.map(item).join('') + '</div>';
}
$('#shop-body').onclick = e => { $('#panel').onclick(e); renderShop(); };

function show(name) {
  for (const id of ['auth', 'menu', 'game', 'shop']) $('#' + id).hidden = id !== name;
  if (name === 'shop') renderShop();
  if (name === 'game') { redraw(); if (!S.name) askName(); else if (!S.tut) tutorial(); }
  scrollTo(0, 0);
}
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) show(g.dataset.go); });
// ---------- аккаунт ----------
let authMode = 'login';
function authSet(m) {
  authMode = m;
  $('#a-login').classList.toggle('on', m === 'login');
  $('#a-reg').classList.toggle('on', m === 'register');
  $('#a-go').textContent = m === 'login' ? 'Войти' : 'Зарегистрироваться';
  $('#a-pass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#a-hint').hidden = m === 'login';
  authMsg('');
}
function authMsg(t, ok) {
  const e = $('#a-msg'); e.textContent = t; e.className = 'a-msg' + (ok ? ' ok' : ''); e.hidden = !t;
  if (!t) $('#a-resend').hidden = true;
}
function renderWho() {
  $('#who').textContent = USER ? '👤 ' + USER.email : 'Вы играете как гость: прогресс хранится только в этом браузере';
  $('#logout').hidden = !USER;
  $('#login').hidden = !!USER || !SERVER;
}
$('#a-login').onclick = () => authSet('login');
$('#a-reg').onclick = () => authSet('register');
$('#a-guest').onclick = () => { localStorage.setItem('hamster-guest', '1'); renderWho(); show('menu'); };
$('#login').onclick = () => { localStorage.removeItem('hamster-guest'); authSet('login'); show('auth'); };
$('#logout').onclick = async () => { await push(true); try { await api('POST', '/api/logout'); } catch (e) {} location.reload(); };
$('#a-resend').onclick = async () => {
  try { await api('POST', '/api/resend', { email: $('#a-email').value }); authMsg('Если такая почта ждёт подтверждения, мы отправили письмо ещё раз.', true); }
  catch (e) { authMsg(e.status ? e.message : 'Нет связи с сервером'); }
};
$('#a-form').onsubmit = async e => {
  e.preventDefault();
  const email = $('#a-email').value.trim(), password = $('#a-pass').value, btn = $('#a-go');
  if (!email || !password) return authMsg('Введите почту и пароль');
  btn.disabled = true; authMsg('');
  try {
    if (authMode === 'register') {
      await api('POST', '/api/register', { email, password });
      $('#a-pass').value = '';
      authSet('login');
      authMsg('Письмо отправлено на ' + email + '. Откройте ссылку в нём, затем войдите. Проверьте папку «Спам».', true);
    } else {
      await api('POST', '/api/login', { email, password });
      location.reload();
    }
  } catch (err) {
    authMsg(err.status ? err.message : 'Нет связи с сервером');
    if (err.code === 'unverified') $('#a-resend').hidden = false;
  } finally { btn.disabled = false; }
};

async function boot() {
  try { USER = (await api('GET', '/api/me')).user; SERVER = true; } catch (e) { USER = null; SERVER = false; }
  KEY = USER ? BASE_KEY + ':' + USER.id : BASE_KEY;
  let local = readLocal(KEY);
  if (USER) {
    try {
      const r = await api('GET', '/api/save');
      if (r.save && (!local || (r.save.last || 0) > (local.last || 0))) local = Object.assign(fresh(), r.save);
      else if (!r.save && !local) { // новый аккаунт: забираем прогресс гостя, если он был
        const g = readLocal(BASE_KEY);
        if (g) { local = g; localStorage.removeItem(BASE_KEY); }
      }
    } catch (e) {}
  }
  S = local || fresh();
  tick(Math.min((Date.now() - S.last) / 1000, 10800));
  redraw();
  renderWho();
  const q = new URLSearchParams(location.search).get('verified');
  if (q !== null) history.replaceState(null, '', location.pathname);
  if (!USER && SERVER && q !== null) {
    authSet('login');
    authMsg(q === '1' ? 'Почта подтверждена! Теперь войдите.' : 'Ссылка недействительна или устарела. Войдите, чтобы получить новое письмо.', q === '1');
    show('auth');
  } else if (!USER && SERVER && !localStorage.getItem('hamster-guest')) { authSet('login'); show('auth'); }
  else show('menu');
  setInterval(() => { tick(1); stats(); save(); }, 1000);
}
boot();
</script>
</body>
</html>
